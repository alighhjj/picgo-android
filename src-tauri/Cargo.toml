[package]
name = "picgo-tutu"
version = "0.1.0"
description = "分享一张图片给这个 App，它上传到 TUTU 并自动复制直链"
authors = ["alighhjj"]
edition = "2021"
rust-version = "1.77"

[lib]
# 移动端把 Rust 编成静态库再由原生工程链接，所以必须有 lib 目标。
# 这个 name 会被 tauri android init 写进 gen/android/gradle.properties 的 tauri_app_lib_name。
name = "picgo_tutu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 钉在 0.12 而不是 0.13：这是真机上踩出来的。
#
# 0.13 把 rustls 变成了默认后端，而它的 `rustls` 特性依赖 `rustls-platform-verifier`
# —— 这个 crate 在 Android 上要靠 JVM 校验系统证书库，官方 README 明确要求打包时
# 「额外加入一个小的 Kotlin 组件」。Tauri 生成的 Android 工程没有它，于是证书校验
# 失败，表现为 TLS 阶段直接断掉，而 reqwest 只报一句
# `error sending request for url (...)`，看不出是 TLS 问题。
#
# 0.12 的 `rustls-tls` = `rustls-tls-webpki-roots` + ring provider：用**内置的
# Mozilla 根证书**，不依赖平台校验器，Android 上开箱可用。
# 代价是不采用系统/用户自装证书，对普通站点（tutu.to）没有影响。
# 注意必须关掉 default features —— 0.12 的默认 TLS 是 native-tls，在 Android 上要 OpenSSL。
reqwest = { version = "0.12", default-features = false, features = ["multipart", "rustls-tls", "charset", "http2"] }
base64 = "0.22"
# 自检命令要正确拆出 host/port，用手写解析容易在畸形 URL 上出错。
url = "2"
