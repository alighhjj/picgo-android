name: 构建 Android APK

# 本机没有 Rust、没有 JDK 21、没有 Android SDK，所以编译与出包全部由这里负责。
# 注意：`tauri android init` 内部会跑 `cargo metadata`，因此它必须和 Rust 工具链一起
# 在这个 workflow 里执行，而 gen/android 不进仓库。
#
# 产物策略（刻意分开，避免每次推都跑双份构建）：
#   - 推 main       → 只出 debug APK（快，用来验证代码能编译）
#   - 推 v* tag     → 只出签名 release APK（体积小、运行快，挂到 Release）
# debug 包保留完整调试能力，release 包走签名 + 精简，两者签名不同不能互相覆盖安装。

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # 这三个值同时被 scripts/patch-android.mjs 使用（它读同名环境变量），
      # 保证「CI 装的 SDK/NDK」与「gradle 要求的」必然一致。
      #
      # 为什么是 36 而不是模板默认的 37：目前仓库里**没有** platforms;android-37
      # 这个包（Android 改成带 minor 的版本号后只有 android-37.0/37.1/37.2，
      # 而 AGP 找的是 android-37）。36 是当前稳定且能装的版本。
      ANDROID_COMPILE_SDK: 36
      ANDROID_TARGET_SDK: 36
      NDK_VERSION: 27.2.12479018

    steps:
      - uses: actions/checkout@v4

      # --- 前端与业务逻辑自检（几秒钟，先把能挡的挡住）------------------------
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 单测 tutu 业务逻辑
        run: pnpm test

      # --- 编译工具链 ---------------------------------------------------------
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # AGP 8.11 用的是 JDK 21 的字节码目标，JDK 17 会直接报错。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 不用 android-actions/setup-android：它的许可接受步骤会去跑交互式的
      # `sdkmanager --licenses`，在新版 cmdline-tools 上直接以退出码 1 失败
      # （“6 of 7 SDK package licenses not accepted”）。这里自己装，步骤可见、错误可查。
      - name: 准备 Android SDK 组件
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK 目录：$SDK"
          test -d "$SDK" || { echo "::error::runner 上没有 Android SDK"; exit 1; }

          # 无条件换成固定版本的 cmdline-tools：runner 自带的那份是 12.0，比较老，
          # 解析新版仓库元数据可能失败。固定版本才能让这一步的结果可预期。
          echo "安装固定版本的 cmdline-tools…"
          curl -fsSL -o /tmp/cmdtools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip"
          rm -rf /tmp/cmdtools "$SDK/cmdline-tools/latest"
          mkdir -p /tmp/cmdtools "$SDK/cmdline-tools/latest"
          unzip -q -o /tmp/cmdtools.zip -d /tmp/cmdtools
          mv /tmp/cmdtools/cmdline-tools/* "$SDK/cmdline-tools/latest/"

          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMGR" --version

          # 许可必须显式接受；用 yes 管道喂进去，失败不致命，真正的门禁是下面这步安装。
          yes | "$SDKMGR" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true

          # 逐包安装、单个失败不中断：个别包名在某些仓库快照里可能不存在，
          # 不该因此让整个步骤挂掉。真正必需的两个包在下面硬校验。
          # 37.0 只是顺手尝试（AGP 要的是 android-37，装上了也未必认），
          # 真正生效的是 patch-android.mjs 把 compileSdk 钉到 36。
          for pkg in \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;27.2.12479018"
          do
            echo "== 安装 $pkg"
            "$SDKMGR" --sdk_root="$SDK" --install "$pkg" || echo "::warning::$pkg 安装失败，继续"
          done

          echo "== 已安装的平台："; ls "$SDK/platforms" || true
          echo "== 已安装的 build-tools："; ls "$SDK/build-tools" || true
          echo "== 已安装的 NDK："; ls "$SDK/ndk" || true

          # 硬校验：缺这两个后面必然编译失败，早点报清楚。
          test -d "$SDK/platforms/android-$ANDROID_COMPILE_SDK" || {
            echo "::error::缺少 android-$ANDROID_COMPILE_SDK 平台"
            exit 1
          }
          test -d "$SDK/ndk/$NDK_VERSION" || {
            echo "::error::缺少 NDK $NDK_VERSION"
            exit 1
          }

          # 让后续步骤用上刚装的工具。
          echo "$SDK/platform-tools"           >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "ANDROID_SDK_ROOT=$SDK"         >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK"             >> "$GITHUB_ENV"

      # Tauri 的 rust gradle 插件要找 NDK。SDK 路径不能写死：ubuntu runner 自带一份
      # Android SDK，setup-android 会把包装进那一份，所以这里从环境变量反查真实路径，
      # 找不到就直接失败（宁可红，也不要带着错路径去编译）。
      - name: 导出 NDK 环境变量
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK 目录：$SDK"
          NDK_DIR="$SDK/ndk/$NDK_VERSION"
          if [ ! -d "$NDK_DIR" ]; then
            echo "::error::找不到 NDK $NDK_VERSION（$NDK_DIR）"
            ls "$SDK/ndk" || true
            exit 1
          fi
          # 社区实践里这几个变量名都出现过，全部指向同一个目录最省事。
          echo "NDK_HOME=$NDK_DIR"         >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"

      # --- 生成工程 + 注入定制 + 打包 ------------------------------------------
      - name: 生成 Android 工程
        run: npx tauri android init --ci --skip-targets-install

      - name: 注入本项目的 Android 定制
        run: node scripts/patch-android.mjs

      # 备用接口要装哪个 NDK/compileSdk 不用猜：直接把生成结果打出来。
      - name: 打印生成的 Android 版本配置
        run: |
          grep -E "compileSdk|minSdk|targetSdk|ndkVersion|applicationId" \
            src-tauri/gen/android/app/build.gradle.kts || true
          grep -cE "signingConfig" src-tauri/gen/android/app/build.gradle.kts || true

      # 只有打 tag 才签 release 包。keystore 与密码来自仓库 Secrets，
      # 通过环境变量传给脚本（不把 secret 直接插进 run 的脚本文本里）。
      - name: 写入签名配置（仅 tag）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEY_BASE64" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::缺少签名相关的 Secrets（ANDROID_KEY_BASE64 / ANDROID_KEY_PASSWORD / ANDROID_KEY_ALIAS），无法产出可安装的 release 包"
            exit 1
          fi
          cd src-tauri/gen/android
          echo "$KEY_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          test -s "$RUNNER_TEMP/upload-keystore.jks" || { echo "::error::keystore 解码失败"; exit 1; }
          {
            echo "keyAlias=$KEY_ALIAS"
            echo "password=$KEY_PASSWORD"
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
          } > keystore.properties
          echo "已写入 keystore.properties（内容不回显）"

      # 只出 arm64 与 armv7：这两者覆盖全部真实手机，同时跳过没人用的 x86 模拟器 ABI。
      - name: 构建 debug APK（推 main）
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx tauri android build --apk --debug -t aarch64 -t armv7

      - name: 构建签名 release APK（打 tag）
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx tauri android build --apk -t aarch64 -t armv7

      - name: 列出产物并检查签名状态
        run: |
          find src-tauri/gen/android/app/build/outputs -name "*.apk" -exec ls -lh {} \;
          # 出现 -unsigned 说明签名没生效 —— 那种包用户装不上，必须当失败处理。
          if find src-tauri/gen/android/app/build/outputs -name "*-unsigned.apk" | grep -q .; then
            echo "::error::产物里出现了未签名的 APK，签名配置没有生效"
            exit 1
          fi

      # 附一份校验和：下载后可以核对文件是否完整。
      # （出过一次「下载卡在 0 没有进度、不确定拿到的文件是否完整」的情况 —— 有哈希就能一眼判定。）
      - name: 生成校验和
        run: |
          APK_DIR=src-tauri/gen/android/app/build/outputs/apk
          cd "$APK_DIR"
          find . -name "*.apk" -type f -exec sha256sum {} \; | sed 's#\./##' | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: picgo-tutu-apk
          if-no-files-found: error
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/apk/**/SHA256SUMS.txt

      # 打 tag 时把 APK 挂到 Release：公开仓库的 Release 资产可以直接下载，
      # 不像 Actions artifact 那样需要登录，方便手机上直接装。
      - name: 附加到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/apk/**/SHA256SUMS.txt
          generate_release_notes: true
